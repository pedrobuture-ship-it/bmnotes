[package]
name = "bmnotes"
version = "0.1.0"
description = "A local-first spatial Markdown workspace."
license = "MIT"
authors = ["bmnotes contributors"]
edition = "2024"

[dependencies]
base64 = "0.23.1"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "bmnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
